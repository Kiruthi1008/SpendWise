<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>SpendWise | Personal Expense &amp; Income Manager</title>

    <meta
      name="description"
      content="SpendWise helps you manage personal expenses, track income, monitor budgets, and analyze your financial activity."

    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="shortcut icon" href="/icon.png" />

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="SpendWise | Personal Finance Manager" />

      name="twitter:description"

    <meta name="mobile-web-app-capable" content="yes" />

  <body class="bg-white text-slate-900 antialiased selection:bg-sky-500 selection:text-white min-h-screen">
